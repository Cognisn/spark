{% import "_brand.html" as brand %}<!DOCTYPE html>
<html lang="en">
<head>
    {% include "_theme_boot.html" %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark - Starting</title>
    {{ brand.favicon_links() }}
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    <script src="/static/js/csrf.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/cognisn.css" rel="stylesheet">
    <link href="/static/css/base.css" rel="stylesheet">
    <link href="/static/css/spark.css" rel="stylesheet">
    <link href="/static/css/chrome.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        .splash-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 1.5rem 1.5rem 6rem;
        }

        /* Subtle radial glow behind the mark */
        .splash-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--app-accent-subtle) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            pointer-events: none;
        }

        /* The bolt in the standard's 72 px slot, with its pulse */
        .splash-icon {
            width: 72px;
            height: 72px;
            position: relative;
            z-index: 1;
            animation: splash-pulse 2.5s ease-in-out infinite;
        }

        .splash-icon svg {
            display: block;
            width: 72px;
            height: 72px;
        }

        @keyframes splash-pulse {
            0%, 100% { filter: drop-shadow(0 0 8px var(--app-accent-glow)); }
            50% { filter: drop-shadow(0 0 20px var(--app-accent-glow)); }
        }

        .splash-container .auth-name,
        .splash-container .auth-descriptor {
            position: relative;
            z-index: 1;
        }

        /* Progress section */
        .splash-progress {
            margin-top: 2.5rem;
            text-align: center;
            position: relative;
            z-index: 1;
            min-height: 80px;
        }

        .splash-progress-bar {
            width: 240px;
            height: 3px;
            background: var(--app-accent-border);
            border-radius: 2px;
            overflow: hidden;
            margin: 0 auto 1rem;
        }

        .splash-progress-fill {
            height: 100%;
            width: 30%;
            background: linear-gradient(90deg, var(--app-accent-dark, #3a78c4), var(--app-accent, #5aaae8));
            border-radius: 2px;
            animation: splash-progress 1.8s ease-in-out infinite;
        }

        @keyframes splash-progress {
            0% { width: 0%; margin-left: 0; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 0%; margin-left: 100%; }
        }

        /* A static frame for people who ask for less motion */
        @media (prefers-reduced-motion: reduce) {
            .splash-icon { animation: none; filter: drop-shadow(0 0 12px var(--app-accent-glow)); }
            .splash-progress-fill { animation: none; width: 50%; margin-left: 25%; }
            #loading-stage { transition: none; }
        }

        #loading-stage {
            font-size: 0.8125rem;
            color: var(--app-text-secondary);
            transition: opacity 0.3s ease;
        }

        #loading-error {
            max-width: 360px;
        }

        /* The standard's endorsement, pinned to the foot of the page */
        .splash-footer {
            position: absolute;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            z-index: 1;
        }

        .splash-footer .auth-endorse {
            margin-top: 0;
        }

        /* Decorative grid lines (very subtle) */
        .splash-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--app-accent-subtle) 1px, transparent 1px),
                linear-gradient(90deg, var(--app-accent-subtle) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.2;
            pointer-events: none;
        }
    </style>
</head>
<body class="auth-page splash-page" data-auth-page>
    <main class="splash-container">
        <div class="splash-grid"></div>
        <div class="splash-glow"></div>

        <!-- The bolt alone, the same geometry as spark-bolt.svg -->
        <div class="splash-icon" aria-hidden="true">
            <svg viewBox="61 61 390 390" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <defs>
                    <linearGradient id="bolt-grad" x1="0" y1="0" x2="0.5" y2="1">
                        <stop offset="0%" stop-color="#7ac0f8"/>
                        <stop offset="100%" stop-color="#5aaae8"/>
                    </linearGradient>
                </defs>
                <polygon points="282,61 143,241 241,241 200,451 369,225 271,225" fill="url(#bolt-grad)"/>
            </svg>
        </div>

        <h1 class="auth-name mt-3">SPARK</h1>
        <p class="auth-descriptor">Secure Personal AI Research Kit</p>

        <div class="splash-progress">
            <div class="splash-progress-bar" role="presentation">
                <div class="splash-progress-fill"></div>
            </div>

            <p id="loading-stage" role="status" aria-live="polite">Starting...</p>

            <div id="loading-error" style="display: none;" class="alert-app alert-app-danger mt-3 mx-auto" role="alert">
                Initialisation failed. Check the terminal for details.
            </div>
        </div>

        <div class="splash-footer">
            {{ brand.endorsement() }}
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        let pollInterval = null;
        const stageEl = document.getElementById('loading-stage');
        let lastStage = '';

        function pollStatus() {
            fetch('/loading/api/status')
                .then(r => r.json())
                .then(data => {
                    const stage = data.stage || 'Loading...';

                    // Fade transition on stage change
                    if (stage !== lastStage) {
                        stageEl.style.opacity = '0';
                        setTimeout(() => {
                            stageEl.textContent = stage;
                            stageEl.style.opacity = '1';
                        }, 150);
                        lastStage = stage;
                    }

                    if (data.ready) {
                        clearInterval(pollInterval);
                        stageEl.style.opacity = '0';
                        setTimeout(() => {
                            stageEl.textContent = 'Ready';
                            stageEl.style.opacity = '1';
                        }, 150);
                        // Brief pause to show "Ready" before redirect
                        setTimeout(() => { window.location.href = '/'; }, 600);
                    } else if (data.error) {
                        clearInterval(pollInterval);
                        document.getElementById('loading-error').style.display = 'block';
                        document.querySelector('.splash-progress-bar').style.display = 'none';
                    }
                })
                .catch(() => {
                    // Server not ready yet, keep polling
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            pollInterval = setInterval(pollStatus, 800);
            pollStatus();
        });
    </script>
</body>
</html>
