{% extends "auth_layout.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<p class="mb-3" style="color: var(--app-text-secondary); font-size: 0.875rem;">
    Enter your email address and, if it has an account that signs in with a password,
    we will send a link to choose a new one.
</p>
<form method="POST" action="/auth/password-reset">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="mb-3">
        <label for="email" class="form-label visually-hidden">Email address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="Email address"
               autocomplete="username" required autofocus>
    </div>
    <button type="submit" class="btn btn-app-primary w-100">
        <i class="bi bi-envelope me-1"></i> Send reset link
    </button>
</form>
<div class="mt-4 text-center" style="font-size: 0.8125rem;">
    <a href="/auth/sign-in">Back to sign-in</a>
</div>
{% endblock %}
