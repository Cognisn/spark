{% extends "base.html" %}

{% block title %}Spark - Conversations{% endblock %}

{% block content %}
<div class="container-fluid" style="max-width: 900px;">

    <div class="d-flex align-items-center justify-content-between mb-3">
        <h4 style="font-family: var(--app-font-heading); font-weight: 700; margin-bottom: 0;">Conversations</h4>
        <button class="btn btn-app-primary" onclick="showNewConversation()">
            <i class="bi bi-plus-lg me-1"></i> New Conversation
        </button>
    </div>

    <!-- Search -->
    <div class="mb-3">
        <div class="app-table-search" style="position: relative;">
            <i class="bi bi-search" style="position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--app-text-muted); pointer-events: none;"></i>
            <input type="text" class="form-control form-control-sm" id="conv-search" placeholder="Search conversations..."
                   style="padding-left: 2.25rem;" oninput="searchConversations(this.value)">
        </div>
    </div>

    <!-- Conversation list -->
    <div id="conversation-list">
        <div class="text-center py-5" style="color: var(--app-text-muted);">
            <div class="app-spinner mx-auto mb-3"></div>
            Loading conversations...
        </div>
    </div>

    <!-- New conversation modal -->
    <div class="modal fade" id="newConvModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>New Conversation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="conv-name" placeholder="e.g. Python Help">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Conversation type</label>
                        <select class="form-select" id="conv-type" onchange="toggleDebateFields()">
                            <option value="standard" selected>Standard chat</option>
                            <option value="debate">Debate</option>
                        </select>
                    </div>
                    <div id="standard-fields">
                        <div class="mb-3">
                            <label class="form-label">Model</label>
                            <select class="form-select" id="conv-model">
                                <option value="">Loading models...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Instructions (optional)</label>
                            <textarea class="form-control" id="conv-instructions" rows="3"
                                      placeholder="Custom system instructions for this conversation"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="conv-kg-local">
                            <label class="form-check-label" for="conv-kg-local">
                                Build a knowledge graph for this conversation
                            </label>
                        </div>
                    </div>
                    <div id="debate-fields" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">Debate topic</label>
                            <textarea class="form-control" id="debate-topic" rows="2"
                                      placeholder="State the proposition to be debated"></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Rounds</label>
                                <select class="form-select" id="debate-rounds-mode"
                                        onchange="document.getElementById('debate-max-rounds-wrap').classList.toggle('d-none', this.value !== 'fixed')">
                                    <option value="fixed" selected>Fixed number</option>
                                    <option value="judge">Judge decides</option>
                                </select>
                            </div>
                            <div class="col" id="debate-max-rounds-wrap">
                                <label class="form-label">Max rounds</label>
                                <input type="number" class="form-control" id="debate-max-rounds" value="2" min="1" max="10">
                            </div>
                        </div>
                        <div class="row" id="debate-agent-cards">
                            <div class="col-md-4">
                                <div class="app-card p-2 mb-2">
                                    <h6>Pro</h6>
                                    <select class="form-select form-select-sm mb-2" id="debate-pro-model"></select>
                                    <textarea class="form-control form-control-sm" id="debate-pro-brief" rows="3"
                                              placeholder="Additional context (cannot change its role)"></textarea>
                                    <a href="#" class="small d-block mt-2" onclick="toggleCaps('pro'); return false;">Capabilities ▸</a>
                                    <div class="d-none debate-caps" id="debate-pro-caps" data-skills-only="false"
                                         style="max-height: 180px; overflow-y: auto; font-size: 0.75rem;"></div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="app-card p-2 mb-2">
                                    <h6>Against</h6>
                                    <select class="form-select form-select-sm mb-2" id="debate-con-model"></select>
                                    <textarea class="form-control form-control-sm" id="debate-con-brief" rows="3"
                                              placeholder="Additional context (cannot change its role)"></textarea>
                                    <a href="#" class="small d-block mt-2" onclick="toggleCaps('con'); return false;">Capabilities ▸</a>
                                    <div class="d-none debate-caps" id="debate-con-caps" data-skills-only="false"
                                         style="max-height: 180px; overflow-y: auto; font-size: 0.75rem;"></div>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="app-card p-2 mb-2">
                                    <h6>Judge</h6>
                                    <select class="form-select form-select-sm mb-2" id="debate-judge-model"></select>
                                    <textarea class="form-control form-control-sm" id="debate-judge-brief" rows="3"
                                              placeholder="Additional context (cannot change its role)"></textarea>
                                    <a href="#" class="small d-block mt-2" onclick="toggleCaps('judge'); return false;">Capabilities ▸</a>
                                    <div class="d-none debate-caps" id="debate-judge-caps" data-skills-only="true"
                                         style="max-height: 180px; overflow-y: auto; font-size: 0.75rem;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-app-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button class="btn btn-app-primary" onclick="createConversation()">
                        <i class="bi bi-check-lg me-1"></i> Create
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', loadConversations);

async function loadConversations() {
    try {
        const resp = await fetch('/conversations/api/list');
        const convs = await resp.json();
        const container = document.getElementById('conversation-list');

        if (!convs.length) {
            container.innerHTML = `
                <div class="app-card text-center py-5">
                    <div class="card-body">
                        <i class="bi bi-chat-square-text" style="font-size: 3rem; color: var(--app-text-muted);"></i>
                        <p class="mt-3" style="color: var(--app-text-secondary);">No conversations yet.</p>
                        <button class="btn btn-app-primary" onclick="showNewConversation()">
                            <i class="bi bi-plus-lg me-1"></i> Create your first conversation
                        </button>
                    </div>
                </div>`;
            return;
        }

        // Sort: favourites first, then by last_updated
        convs.sort((a, b) => (b.is_favourite || 0) - (a.is_favourite || 0));

        container.innerHTML = convs.map(c => {
            const isFav = c.is_favourite;
            const starIcon = isFav ? 'bi-star-fill' : 'bi-star';
            const starColor = isFav ? 'color: var(--app-warning);' : 'color: var(--app-text-muted);';
            const isDebate = c.conversation_type === 'debate';
            const href = isDebate ? `/debate/${c.id}` : `/chat/${c.id}`;
            const typeBadge = isDebate
                ? '<span class="badge ms-2" style="background: var(--app-accent); color: var(--app-bg-primary);">Debate</span>'
                : '';
            return `
            <div class="app-card d-flex align-items-center p-3 mb-2">
                <button class="btn btn-app-ghost btn-sm me-2" onclick="toggleFavourite(${c.id}, ${!isFav})" title="${isFav ? 'Remove from favourites' : 'Add to favourites'}" style="${starColor}">
                    <i class="bi ${starIcon}"></i>
                </button>
                <a href="${href}" class="flex-grow-1 text-decoration-none" style="cursor: pointer;">
                    <div style="font-weight: 600; color: var(--app-text-primary);">${escapeHtml(c.name)}${typeBadge}</div>
                    <div style="font-size: 0.8125rem; color: var(--app-text-muted);">
                        ${c.model_id || 'No model'} &middot; ${c.total_tokens || 0} tokens
                        ${c.message_count ? ` &middot; ${c.message_count} messages` : ''}
                    </div>
                </a>
                <button class="btn btn-app-ghost btn-sm ms-2" style="color: var(--app-danger);" onclick="deleteConversation(${c.id}, '${escapeHtml(c.name)}')" title="Delete">
                    <i class="bi bi-trash"></i>
                </button>
                <a href="${href}" class="ms-1" style="color: var(--app-text-muted);"><i class="bi bi-chevron-right"></i></a>
            </div>`;
        }).join('');
    } catch (err) {
        document.getElementById('conversation-list').innerHTML =
            `<div class="alert-app alert-app-danger">Failed to load conversations.</div>`;
    }
}

let _debateCaps = null;

function toggleCaps(role) {
    document.getElementById(`debate-${role}-caps`).classList.toggle('d-none');
}

async function loadDebateCapabilities() {
    try {
        const resp = await fetch('/debate/api/capabilities');
        _debateCaps = await resp.json();
    } catch (err) { _debateCaps = { tools: [], skills: [] }; return; }
    for (const role of ['pro', 'con', 'judge']) {
        const box = document.getElementById(`debate-${role}-caps`);
        if (!box) continue;
        const skillsOnly = box.dataset.skillsOnly === 'true';
        let html = '';
        if (!skillsOnly) {
            for (const group of _debateCaps.tools) {
                const gid = `${role}-g-${group.group.replace(/[^a-z0-9]/gi, '-')}`;
                html += `<div class="fw-semibold mt-1">
                    <input type="checkbox" checked onchange="document.querySelectorAll('#debate-${role}-caps [data-group=\'${gid}\']').forEach(b => b.checked = this.checked)">
                    ${escapeHtml(group.group)}</div>`;
                for (const tool of group.tools) {
                    html += `<div class="ms-3"><label><input type="checkbox" checked data-kind="tool" data-group="${gid}" value="${escapeHtml(tool.name)}"> ${escapeHtml(tool.name)}</label></div>`;
                }
            }
        }
        if (_debateCaps.skills.length) {
            html += '<div class="fw-semibold mt-1">Skills</div>';
            for (const skill of _debateCaps.skills) {
                html += `<div class="ms-3"><label><input type="checkbox" checked data-kind="skill" value="${escapeHtml(skill.name)}"> ${escapeHtml(skill.name)}</label></div>`;
            }
        } else if (skillsOnly) {
            html += '<div class="ms-1" style="color: var(--app-text-muted);">No skills installed.</div>';
        }
        box.innerHTML = html || '<div style="color: var(--app-text-muted);">Nothing to configure.</div>';
    }
}

function collectAllowlist(role, kind) {
    const boxes = [...document.querySelectorAll(`#debate-${role}-caps input[data-kind="${kind}"]`)];
    if (!boxes.length) return undefined;
    const ticked = boxes.filter(b => b.checked).map(b => b.value);
    return ticked.length === boxes.length ? undefined : ticked;  // fully ticked = everything
}

function toggleDebateFields() {
    const isDebate = document.getElementById('conv-type').value === 'debate';
    document.getElementById('debate-fields').classList.toggle('d-none', !isDebate);
    document.getElementById('standard-fields').classList.toggle('d-none', isDebate);
}

async function showNewConversation() {
    // Load models
    try {
        const resp = await fetch('/conversations/api/models');
        const data = await resp.json();
        const models = data.models || data;  // Handle both old [] and new {models, default_model} format
        const defaultModel = data.default_model || null;
        const mandatory = data.mandatory || false;
        const select = document.getElementById('conv-model');

        const optionsHtml = models.length
            ? models.map(m =>
                `<option value="${m.id}" ${m.id === defaultModel ? 'selected' : ''}>${m.name} (${m.provider})</option>`
              ).join('')
            : '<option value="">No models available — configure a provider first</option>';
        select.innerHTML = optionsHtml;

        // Populate the per-agent debate selects from the same model list
        for (const role of ['pro', 'con', 'judge']) {
            document.getElementById(`debate-${role}-model`).innerHTML = optionsHtml;
        }

        // If mandatory, disable the select
        select.disabled = mandatory;
        if (mandatory) {
            select.title = 'Model is locked by administrator settings';
        } else {
            select.title = '';
        }
    } catch (err) {
        // Ignore
    }
    loadDebateCapabilities();
    new bootstrap.Modal(document.getElementById('newConvModal')).show();
}

function buildCreatePayload() {
    const name = document.getElementById('conv-name').value.trim() || 'New Conversation';
    const type = document.getElementById('conv-type').value;
    if (type !== 'debate') {
        return {
            name,
            model_id: document.getElementById('conv-model').value,
            instructions: document.getElementById('conv-instructions').value.trim() || null,
            kg_local_enabled: document.getElementById('conv-kg-local').checked,
        };
    }
    const agents = Object.fromEntries(['pro', 'con', 'judge'].map(role => {
        const spec = {
            model_id: document.getElementById(`debate-${role}-model`).value,
            brief: document.getElementById(`debate-${role}-brief`).value.trim() || null,
        };
        const tools = role === 'judge' ? undefined : collectAllowlist(role, 'tool');
        const skills = collectAllowlist(role, 'skill');
        if (tools !== undefined) spec.allowed_tools = tools;
        if (skills !== undefined) spec.allowed_skills = skills;
        return [role, spec];
    }));
    const roundsMode = document.getElementById('debate-rounds-mode').value;
    return {
        name,
        conversation_type: 'debate',
        // The judge's model is the conversation's display model
        model_id: agents.judge.model_id,
        debate: {
            topic: document.getElementById('debate-topic').value.trim(),
            rounds_mode: roundsMode,
            max_rounds: roundsMode === 'fixed'
                ? (parseInt(document.getElementById('debate-max-rounds').value) || null)
                : null,
            agents,
        },
    };
}

async function createConversation() {
    const payload = buildCreatePayload();

    if (!payload.model_id) {
        AppToast.warning('No model', 'Please select a model.');
        return;
    }
    if (payload.conversation_type === 'debate' && !payload.debate.topic) {
        AppToast.warning('No topic', 'Please enter the debate topic.');
        return;
    }

    try {
        const resp = await fetch('/conversations/api/create', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (data.id) {
            window.location.href = data.conversation_type === 'debate'
                ? `/debate/${data.id}` : `/chat/${data.id}`;
        } else {
            AppToast.danger('Error', data.error || 'Failed to create conversation.');
        }
    } catch (err) {
        AppToast.danger('Error', 'Network error.');
    }
}

async function toggleFavourite(id, favourite) {
    try {
        await fetch(`/conversations/api/${id}/favourite`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ favourite }),
        });
        loadConversations();
    } catch (err) {
        AppToast.danger('Error', 'Failed to update.');
    }
}

let _searchDebounce = null;
function searchConversations(query) {
    clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(async () => {
        if (!query.trim()) { loadConversations(); return; }
        try {
            const resp = await fetch(`/conversations/api/search?q=${encodeURIComponent(query)}`);
            const results = await resp.json();
            const container = document.getElementById('conversation-list');
            if (!results.length) {
                container.innerHTML = '<div class="text-center py-3" style="color:var(--app-text-muted);">No matches found.</div>';
                return;
            }
            container.innerHTML = results.map(c => {
                const href = c.conversation_type === 'debate' ? `/debate/${c.id}` : `/chat/${c.id}`;
                return `
                <div class="app-card d-flex align-items-center p-3 mb-2">
                    <a href="${href}" class="flex-grow-1 text-decoration-none">
                        <div style="font-weight:600; color:var(--app-text-primary);">${escapeHtml(c.name)}</div>
                        <div style="font-size:0.8125rem; color:var(--app-text-muted);">${c.model_id || ''}</div>
                    </a>
                    <a href="${href}" style="color:var(--app-text-muted);"><i class="bi bi-chevron-right"></i></a>
                </div>`;
            }).join('');
        } catch (err) {}
    }, 300);
}

async function deleteConversation(id, name) {
    if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
    try {
        await fetch(`/conversations/api/${id}`, { method: 'DELETE' });
        loadConversations();
        AppToast.success('Deleted', `"${name}" has been deleted.`);
    } catch (err) {
        AppToast.danger('Error', 'Failed to delete.');
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
