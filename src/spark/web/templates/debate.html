{% extends "base.html" %}

{% block title %}Spark - Debate{% endblock %}

{% block content %}
<div id="debate-root" data-conversation-id="{{ conversation_id }}" class="debate-layout">
    <div id="judge-pane" class="app-card debate-judge">
        <div class="debate-pane-header">Judge</div>
        <div id="judge-content" class="debate-pane-body"></div>
    </div>
    <div class="debate-sides">
        <div id="pro-pane" class="app-card debate-side">
            <div class="debate-pane-header">Pro
                <button id="pro-cancel" class="btn btn-sm btn-app-ghost d-none">Cancel</button>
            </div>
            <div id="pro-content" class="debate-pane-body"></div>
        </div>
        <div id="con-pane" class="app-card debate-side">
            <div class="debate-pane-header">Against
                <button id="con-cancel" class="btn btn-sm btn-app-ghost d-none">Cancel</button>
            </div>
            <div id="con-content" class="debate-pane-body"></div>
        </div>
    </div>
    <div class="debate-controls app-card">
        <span id="debate-status" class="badge" style="background: var(--app-accent); color: var(--app-bg-primary);">Loading</span>
        <button id="debate-resume" class="btn btn-sm btn-app-primary d-none">Resume</button>
        <button id="debate-retry" class="btn btn-sm btn-app-primary d-none">Retry turn</button>
        <div class="debate-input">
            <input id="debate-prompt" class="form-control"
                   placeholder="Send a directive to all agents (or a question to the judge after the ruling)">
            <button id="debate-send" class="btn btn-app-primary">Send</button>
        </div>
    </div>
</div>
<style>
    .debate-layout { display: flex; flex-direction: column; gap: 0.75rem; height: calc(100vh - 120px); }
    .debate-judge { flex: 0 0 30%; overflow-y: auto; }
    .debate-sides { display: flex; gap: 0.75rem; flex: 1; min-height: 0; }
    .debate-side { flex: 1; overflow-y: auto; min-width: 0; }
    .debate-pane-header { font-weight: 600; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--app-border);
                          display: flex; justify-content: space-between; align-items: center;
                          position: sticky; top: 0; background: inherit; z-index: 1; }
    .debate-pane-body { padding: 0.75rem; }
    .debate-controls { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; }
    .debate-input { display: flex; gap: 0.5rem; flex: 1; }
    .exhibit-card { border: 1px solid var(--app-border); border-radius: 6px; padding: 0.5rem;
                    margin-top: 0.5rem; background: var(--app-bg-secondary); }
    .debate-ruling { border-left: 4px solid var(--app-accent); padding-left: 0.75rem; }
</style>
{% endblock %}

{% block scripts %}
<script src="/static/js/debate.js"></script>
{% endblock %}
