<!DOCTYPE html>
<html lang="en">
<head>
    <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('app-theme') || 'dark');</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Spark - {% block title %}Sign In{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/cognisn.css" rel="stylesheet">
    <link href="/static/css/base.css" rel="stylesheet">
    <link href="/static/css/spark.css" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <div class="d-flex align-items-center justify-content-center py-4" style="min-height: 100vh;">
        <div class="app-card" style="width: 100%; max-width: {% block width %}420px{% endblock %};">
            <div class="card-body p-4">
                <div class="text-center">
                    <svg width="56" height="56" viewBox="0 0 130 130" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-2" aria-hidden="true">
                        <defs>
                            <linearGradient id="auth-arc" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="var(--app-accent-dark)"/>
                                <stop offset="50%" stop-color="var(--app-accent)"/>
                                <stop offset="100%" stop-color="var(--app-accent-dark)"/>
                            </linearGradient>
                            <radialGradient id="auth-dot" cx="40%" cy="35%" r="60%">
                                <stop offset="0%" stop-color="var(--app-accent-light)"/>
                                <stop offset="100%" stop-color="var(--app-accent)"/>
                            </radialGradient>
                        </defs>
                        <g transform="translate(65,65)">
                            <path d="M32 -48 A48 48 0 1 0 32 48" stroke="url(#auth-arc)" stroke-width="4" fill="none" stroke-linecap="round"/>
                            <circle cx="32" cy="-48" r="5" fill="var(--app-accent-light)"/>
                            <circle cx="32" cy="48" r="5" fill="var(--app-accent)" opacity="0.85"/>
                            <circle cx="12" cy="0" r="9" fill="url(#auth-dot)"/>
                            <circle cx="12" cy="0" r="4.5" fill="var(--app-accent-light)" opacity="0.9"/>
                        </g>
                    </svg>
                    <h4 style="font-family: var(--app-font-heading); font-weight: 700;">
                        <i class="bi bi-lightning-charge-fill" style="font-size: 1rem; color: var(--app-text-secondary);"></i>
                        Spark
                    </h4>
                </div>

                {% if notice %}
                <div class="alert-app alert-app-success mb-3" role="status">
                    <i class="bi bi-check-circle-fill me-1"></i> {{ notice }}
                </div>
                {% endif %}
                {% if error %}
                <div class="alert-app alert-app-danger mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
                </div>
                {% endif %}

                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/ui.js"></script>
    <script src="/static/js/copy.js"></script>
    <script>
    // Links carrying a token: keep the token out of the address bar and history.
    if (new URLSearchParams(window.location.search).has('token') || new URLSearchParams(window.location.search).has('code')) {
        window.history.replaceState(null, '', window.location.pathname);
    }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
