# Spark in server mode as a Portainer stack on a standalone Docker environment
# (not Swarm): PostgreSQL with pgvector, a one-shot migration and first-run
# bootstrap, the web role, the worker role and a local mail catcher. See
# docs/deployment/portainer.md.
#
# Paste this file into Portainer's web editor (Stacks > Add stack), or deploy it
# from the Git repository with deploy/portainer/stack.yaml as the Compose path,
# and set the variables below under Environment variables. The stack refuses to
# deploy while a required one is missing.
#
#   SPARK_IMAGE            the image, pinned to a version (no latest tag)
#   SPARK_PUBLIC_BASE_URL  https address users reach Spark on, through your proxy
#   POSTGRES_PASSWORD      the database owner's password (letters, digits, - and _)
#   KONFIG_MASTER_KEY      the key to konfig's encrypted secrets file
#   SPARK__BOOTSTRAP__ADMIN__EMAIL, SPARK__BOOTSTRAP__ADMIN__FIRST_NAME,
#   SPARK__BOOTSTRAP__ADMIN__LAST_NAME
#                          the first administrator, invited by mail on the first
#                          start (docs/deployment/identity.md)
#   POSTGRES_USER, POSTGRES_DB, SPARK_BIND, SPARK_WEB_PORT, SPARK_MAIL_PORT,
#   SPARK_LOG_LEVEL, SPARK__MAIL__SMTP__HOST, SPARK__MAIL__SMTP__PORT,
#   SPARK__MAIL__SMTP__TLS, SPARK__MAIL__SMTP__SENDER_ADDRESS,
#   SPARK__MAIL__SMTP__SENDER_NAME
#                          optional, with the defaults shown below (mail defaults
#                          to the catcher; a real mail server replaces it)
#
# The mail catcher's inbox (http://127.0.0.1:8025) is published on 127.0.0.1 only.
# The web port is published on 127.0.0.1 unless SPARK_BIND says otherwise: put
# a TLS reverse proxy in front, and never let users reach port 8000 directly.

x-spark: &spark
  image: ${SPARK_IMAGE:?set SPARK_IMAGE, for example ghcr.io/cognisn/spark:0.3.0rc1}
  init: true
  environment:
    SPARK__MODE: server
    SPARK__DATABASE__URL: postgresql://${POSTGRES_USER:-spark}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-spark}
    SPARK__SERVER__PUBLIC_BASE_URL: ${SPARK_PUBLIC_BASE_URL:?set SPARK_PUBLIC_BASE_URL, for example https://spark.example.com}
    KONFIG_MASTER_KEY: ${KONFIG_MASTER_KEY:?set KONFIG_MASTER_KEY}
    # konfig's encrypted secrets file on the data volume, shared by every container.
    SPARK__SECRETS__BACKEND: encrypted_file
    SPARK__SECRETS__FILE_PATH: /var/lib/spark/data/spark/secrets.enc
    # Users' file areas (uploads and documents Spark creates), on their own volume.
    SPARK__FILES__ROOT: /var/lib/spark-files
    SPARK__LOGGING__LEVEL: ${SPARK_LOG_LEVEL:-INFO}
    # The first administrator, invited by spark bootstrap on the first start.
    SPARK__BOOTSTRAP__ADMIN__EMAIL: ${SPARK__BOOTSTRAP__ADMIN__EMAIL:?set SPARK__BOOTSTRAP__ADMIN__EMAIL, for example admin@example.com}
    SPARK__BOOTSTRAP__ADMIN__FIRST_NAME: ${SPARK__BOOTSTRAP__ADMIN__FIRST_NAME:?set SPARK__BOOTSTRAP__ADMIN__FIRST_NAME}
    SPARK__BOOTSTRAP__ADMIN__LAST_NAME: ${SPARK__BOOTSTRAP__ADMIN__LAST_NAME:?set SPARK__BOOTSTRAP__ADMIN__LAST_NAME}
    # Mail for the invitation, stored as the instance's mail settings on the first
    # start. The defaults send to the mail catcher below; for a real mail server
    # set the host, port 587 with starttls (or 465 with implicit), and put its
    # password in the secrets store as mail_smtp_password.
    SPARK__MAIL__SMTP__HOST: ${SPARK__MAIL__SMTP__HOST:-127.0.0.1}
    SPARK__MAIL__SMTP__PORT: ${SPARK__MAIL__SMTP__PORT:-1025}
    SPARK__MAIL__SMTP__TLS: ${SPARK__MAIL__SMTP__TLS:-none}
    SPARK__MAIL__SMTP__SENDER_ADDRESS: ${SPARK__MAIL__SMTP__SENDER_ADDRESS:-spark@example.com}
    SPARK__MAIL__SMTP__SENDER_NAME: ${SPARK__MAIL__SMTP__SENDER_NAME:-Spark}
    # Add other start-up settings here as SPARK__<SECTION>__<KEY>, for example
    # SPARK__WARDEN__AUDIT__TRUSTED_PROXIES: 192.0.2.10/32
  volumes:
    - spark-data:/var/lib/spark
    - spark-files:/var/lib/spark-files
    - spark-models:/var/cache/spark/huggingface
  # Spark's containers share the mail catcher's network namespace, so its SMTP
  # port is on loopback: Spark sends plain text only to a loopback host.
  network_mode: "service:mailpit"
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-spark}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # A local mail catcher for the invitation and password resets: its inbox is at
  # http://127.0.0.1:8025. It also publishes the web port, since Spark's
  # containers share its network namespace.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${SPARK_BIND:-127.0.0.1}:${SPARK_WEB_PORT:-8000}:8000"
      - "127.0.0.1:${SPARK_MAIL_PORT:-8025}:8025"
    restart: unless-stopped

  # Brings the schema to the current version, then runs the first-run steps
  # (the instance identity, the first administrator's invitation; safe to run
  # again), then exits. Web and worker start only after it succeeds. Portainer
  # shows it as exited (0): that is expected.
  migrate:
    <<: *spark
    entrypoint: ["/bin/sh", "-c"]
    command: ["spark migrate && spark bootstrap"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    <<: *spark
    command: ["web"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Scheduled actions, knowledge graph builds, warden's pruning and audit purge.
  # bootstrap has created the instance's identity before it starts.
  worker:
    <<: *spark
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  spark-data:
  spark-files:
  spark-models:
