# Spark in server mode: PostgreSQL with pgvector, a one-shot migration and
# bootstrap, the web role, the worker role and a local mail catcher. See
# docs/container.md and docs/deployment/compose.md.
#
#   cp deploy/spark.env.example deploy/spark.env    # then set real credentials
#   docker compose -p spark -f deploy/compose.yaml up -d
#
# Credentials come only from the env file the operator writes (SPARK_ENV_FILE,
# default deploy/spark.env next to this file). Published ports bind to 127.0.0.1
# unless SPARK_BIND says otherwise; put a TLS reverse proxy in front for anything
# beyond this host.

# Container hardening for every Spark service (docs/deployment/container-hardening.md):
# a read-only root filesystem, every Linux capability dropped, no privilege gain
# through setuid files, Docker's default seccomp profile (none is named), and an
# init process. Spark writes only to its three volumes and to /tmp, a tmpfs that
# allows no programs to run from it. The web role's /tmp is larger, for uploads
# and bundle imports (up to 1 GiB) that pass through it.
x-spark-hardening: &spark-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=256m

x-spark: &spark
  <<: *spark-hardening
  image: ${SPARK_IMAGE:-ghcr.io/cognisn/spark:0.3.0}
  env_file:
    - path: ${SPARK_ENV_FILE:-spark.env}
      required: true
  environment:
    SPARK__MODE: server
    # konfig's encrypted secrets file, keyed by KONFIG_MASTER_KEY from the env
    # file. It lives in the spark-data volume, so every container reads one file.
    SPARK__SECRETS__BACKEND: encrypted_file
    SPARK__SECRETS__FILE_PATH: /var/lib/spark/data/spark/secrets.enc
    # Users' file areas (uploads and documents Spark creates), on their own volume.
    SPARK__FILES__ROOT: /var/lib/spark-files
  volumes:
    - spark-data:/var/lib/spark
    - spark-files:/var/lib/spark-files
    - spark-models:/var/cache/spark/huggingface
  # Spark's containers share the mail catcher's network namespace, so its SMTP
  # port is on loopback: Spark sends plain text only to a loopback host. A real
  # mail server needs none of this (docs/deployment/compose.md).
  network_mode: "service:mailpit"
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - path: ${SPARK_ENV_FILE:-spark.env}
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # A local mail catcher for invitations and password resets: open its inbox at
  # http://127.0.0.1:8025. It also publishes the web port, since Spark's
  # containers share its network namespace.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${SPARK_BIND:-127.0.0.1}:${SPARK_WEB_PORT:-8000}:8000"
      - "${SPARK_BIND:-127.0.0.1}:${SPARK_MAIL_PORT:-8025}:8025"
    restart: unless-stopped

  # Brings the schema to the current version, then runs the first-run steps
  # (restricted logins, the instance identity, the first administrator's
  # invitation; safe to run again), then exits. Web and worker start only after
  # it succeeds; both refuse a database behind the schema.
  migrate:
    <<: *spark
    entrypoint: ["/bin/sh", "-c"]
    command: ["spark migrate && spark bootstrap"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    <<: *spark
    command: ["web"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Runs scheduled actions. Scale it for standby workers: one holds the
  # PostgreSQL advisory lock and is active, the others wait to take over.
  # bootstrap has created the instance's identity before it starts. With
  # restricted database roles, give web and worker their own URLs
  # (docs/deployment/database.md).
  worker:
    <<: *spark
    command: ["worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  spark-data:
  spark-files:
  spark-models:
