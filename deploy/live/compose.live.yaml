# The live end-to-end stack (A18): layered over deploy/compose.yaml by
# deploy/live/stack.py, never used on its own and never for a real deployment.
#
# deploy/compose.yaml's shape is kept: migrate runs `spark migrate && spark
# bootstrap`, and migrate and web share the network namespace of its mail
# catcher (mailpit), which publishes web's port and its inbox. This overlay gives
# that catcher STARTTLS from a throwaway CA and adds a second web replica, a
# standby worker, an OIDC provider (mock-oauth2-server) behind the same CA, a
# scripted model server (Ollama on http, Anthropic on https with the same CA) and
# an MCP server in web's namespace. Every value below comes from the env file
# that stack.py writes into the sandbox; the CA, keys and passwords live only
# there. Every published port binds to 127.0.0.1.

x-live-environment: &live-environment
  # The throwaway CA plus the public CAs: SPARK reaches the OIDC provider, the
  # mail catcher and the model stub's https API over verified TLS, as it does in
  # production.
  SSL_CERT_FILE: /etc/spark-live/ca-bundle.pem
  # The second replica answers on its own origin.
  SPARK__INTERFACE__ALLOWED_ORIGINS: "http://127.0.0.1:${LIVE_WEB2_PORT}"

# deploy/compose.yaml's container hardening, for the services this overlay adds that
# run the Spark image (anchors do not cross files): read-only root, no capabilities,
# no privilege gain, Docker's default seccomp profile, init, and a tmpfs /tmp.
x-live-hardening: &live-hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-live-volumes: &live-volumes
  - ${LIVE_CERTS}:/etc/spark-live:ro
  - ${LIVE_TOOLS}:/opt/spark-live:ro

services:
  postgres:
    ports:
      - "127.0.0.1:${LIVE_POSTGRES_PORT}:5432"

  # The one mail catcher, deploy/compose.yaml's. It requires STARTTLS with a
  # certificate for "mailpit" from the throwaway CA, so every Spark container sends
  # to it by that name over verified TLS, whether or not it shares its namespace.
  mailpit:
    command:
      - --smtp-tls-cert=/etc/spark-live/mailpit.crt
      - --smtp-tls-key=/etc/spark-live/mailpit.key
      - --smtp-require-starttls
      - --smtp-auth-accept-any
    volumes:
      - ${LIVE_CERTS}:/etc/spark-live:ro

  migrate:
    image: ${SPARK_IMAGE}
    environment: *live-environment
    volumes: *live-volumes
    depends_on:
      oidc:
        condition: service_started

  web:
    image: ${SPARK_IMAGE}
    environment: *live-environment
    volumes: *live-volumes
    depends_on:
      oidc:
        condition: service_started
      model-stub:
        condition: service_started

  web2:
    <<: *live-hardening
    image: ${SPARK_IMAGE}
    command: ["web"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g
    env_file:
      - path: ${SPARK_ENV_FILE}
        required: true
    environment:
      <<: *live-environment
      SPARK__MODE: server
      SPARK__SECRETS__BACKEND: encrypted_file
      SPARK__SECRETS__FILE_PATH: /var/lib/spark/data/spark/secrets.enc
      SPARK__FILES__ROOT: /var/lib/spark-files
    volumes:
      - spark-data:/var/lib/spark
      - spark-files:/var/lib/spark-files
      - spark-models:/var/cache/spark/huggingface
      - ${LIVE_CERTS}:/etc/spark-live:ro
      - ${LIVE_TOOLS}:/opt/spark-live:ro
    ports:
      - "127.0.0.1:${LIVE_WEB2_PORT}:8000"
    restart: unless-stopped
    depends_on:
      # bootstrap has created the instance's identity and invited the first
      # administrator; web2 waits for it as web does.
      migrate:
        condition: service_completed_successfully
      oidc:
        condition: service_started
      model-stub:
        condition: service_started

  worker:
    image: ${SPARK_IMAGE}
    environment: *live-environment
    volumes: *live-volumes
    # One active worker and one on standby (failover check). Each has a network
    # namespace of its own, so its own address and host name: the suite tells the
    # active worker from the standby by the address holding the worker lock and by
    # the host name in a claimed job.
    network_mode: !reset null
    scale: 2

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:${LIVE_OIDC_VERSION}
    environment:
      SERVER_PORT: "8443"
      JSON_CONFIG_PATH: /etc/spark-live/oidc.json
    volumes:
      - ${LIVE_CERTS}:/etc/spark-live:ro
    ports:
      - "127.0.0.1:${LIVE_OIDC_PORT}:8443"
    restart: unless-stopped

  model-stub:
    image: python:${LIVE_PYTHON_VERSION}
    command: ["python", "-I", "/opt/spark-live/model_stub.py"]
    environment:
      LIVE_STUB_CERTS: /etc/spark-live
    volumes:
      - ${LIVE_TOOLS}:/opt/spark-live:ro
      - ${LIVE_CERTS}:/etc/spark-live:ro
    ports:
      - "127.0.0.1:${LIVE_STUB_PORT}:11434"
    restart: unless-stopped

  # A streamable-HTTP MCP server in the catcher's network namespace, which web
  # shares, so web reaches it on loopback (conduit allows plain http only there).
  # Only web connects to it; web2 and the workers cannot reach it.
  mcp:
    <<: *live-hardening
    image: ${SPARK_IMAGE}
    entrypoint: ["python", "-I", "/opt/spark-live/mcp_server.py"]
    command: []
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    network_mode: "service:mailpit"
    volumes:
      - ${LIVE_TOOLS}:/opt/spark-live:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
