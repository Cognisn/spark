name: Install crane
description: >-
  Installs crane (go-containerregistry) from a pinned release, checked against its
  published sha256 before it is unpacked. crane copies a manifest and its blobs as they
  are, so a copy keeps the digest. Used by every job that copies or reads a Spark image
  (scripts/copy-image.sh and scripts/verify-image.sh), so the test copy and the central
  copy run the same tool at the same version.

runs:
  using: composite
  steps:
    - name: Install crane
      shell: bash
      env:
        CRANE_VERSION: "0.22.1"
        CRANE_SHA256: "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
        echo "$CRANE_SHA256  $archive" | sha256sum --check --strict -
        mkdir -p "$RUNNER_TEMP/crane-bin"
        tar -xzf "$archive" -C "$RUNNER_TEMP/crane-bin" crane
        echo "$RUNNER_TEMP/crane-bin" >> "$GITHUB_PATH"
