name: Container publish

# Pushes the checked and scanned image to ghcr.io: from a v* tag, or a manual dispatch.
# Tags are the version only (0.3.0rcN or 0.3.0), never latest; see container.yml.
#
# A v* tag push (release candidate or final) then copies the image byte for byte to the central
# repository and signs that digest (the publish-central job, in the GitHub environment
# spark-release). A release-candidate tag then deploys to the test environment (the deploy-test
# job), which first verifies the signature of the digest it deploys. See
# docs/deployment/release-images.md and docs/deployment/aws.md.
#
# The repository is public and so are its run logs: every AWS identifier is masked before a
# step can print it, and none is written in this file.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      push: true

  # Runs for every v* tag push (final versions and release candidates), never for a manual
  # dispatch. The spark-release environment allows deployments from v* tags only.
  publish-central:
    name: push to the central repository and sign
    needs: publish
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: spark-release
    permissions:
      id-token: write
      contents: read
      packages: read
    concurrency:
      group: publish-spark-central
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.central.outputs.digest }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
      CENTRAL_ECR_REPOSITORY_URI: ${{ vars.CENTRAL_ECR_REPOSITORY_URI }}
      IMAGE_SIGNING_KEY: ${{ vars.IMAGE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version and mask every identifier
        id: version
        run: |
          set -euo pipefail
          # Mask first: nothing below can print these.
          account="${AWS_RELEASE_ROLE_ARN#arn:*:iam::}"
          account="${account%%:*}"
          host="${CENTRAL_ECR_REPOSITORY_URI%%/*}"
          key_arn="${IMAGE_SIGNING_KEY#awskms:///}"
          for value in "$AWS_RELEASE_ROLE_ARN" "${AWS_RELEASE_ROLE_ARN##*/}" "$account" \
            "$CENTRAL_ECR_REPOSITORY_URI" "$host" "${host%%.*}" \
            "$IMAGE_SIGNING_KEY" "$key_arn" "${key_arn##*/}"; do
            [ -z "$value" ] || echo "::add-mask::$value"
          done
          for name in AWS_REGION AWS_RELEASE_ROLE_ARN CENTRAL_ECR_REPOSITORY_URI IMAGE_SIGNING_KEY; do
            [ -n "${!name}" ] || { echo "::error::the spark-release environment variable $name is not set"; exit 1; }
          done
          case "$IMAGE_SIGNING_KEY" in
            awskms:///*) ;;
            *) echo "::error::IMAGE_SIGNING_KEY must be an awskms:/// key reference"; exit 1 ;;
          esac
          version="$(cat src/spark/_version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(rc[0-9]+)?$ ]]; then
            echo "::error::$version is neither a final version nor a release candidate"
            exit 1
          fi
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Copy to the central repository, sign and verify
        id: central
        uses: ./.github/actions/publish-central
        with:
          version: ${{ steps.version.outputs.version }}
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Runs only for a release-candidate tag push (v<version>rcN), never for a final version or
  # a manual dispatch, and only after publish-central has pushed and signed the image. The
  # version is read from src/spark/_version.txt and must match the tag (the same file
  # container.yml tags the image from).
  deploy-test:
    name: deploy to the test environment
    needs: [publish, publish-central]
    if: github.event_name == 'push' && github.ref_type == 'tag' && contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: spark-test
    permissions:
      id-token: write
      contents: read
      packages: read
    concurrency:
      group: deploy-spark-test
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      STACK_NAME: ${{ vars.SPARK_TEST_STACK_NAME }}
      SERVICE_ROLE_NAME: ${{ vars.SPARK_TEST_SERVICE_ROLE_NAME }}
      CENTRAL_ECR_REPOSITORY_URI: ${{ vars.CENTRAL_ECR_REPOSITORY_URI }}
      IMAGE_SIGNING_PUBLIC_KEY: ${{ vars.IMAGE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out the version and mask every identifier
        id: version
        run: |
          set -euo pipefail
          # Mask first: nothing below can print these.
          account="${DEPLOY_ROLE_ARN#arn:*:iam::}"
          account="${account%%:*}"
          central_host="${CENTRAL_ECR_REPOSITORY_URI%%/*}"
          for value in "$DEPLOY_ROLE_ARN" "${DEPLOY_ROLE_ARN##*/}" "$account" \
            "$ECR_REPOSITORY_URI" "${ECR_REPOSITORY_URI%%/*}" "$STACK_NAME" "$SERVICE_ROLE_NAME" \
            "$CENTRAL_ECR_REPOSITORY_URI" "$central_host" "${central_host%%.*}"; do
            [ -z "$value" ] || echo "::add-mask::$value"
          done
          for name in AWS_REGION DEPLOY_ROLE_ARN ECR_REPOSITORY_URI STACK_NAME SERVICE_ROLE_NAME \
            CENTRAL_ECR_REPOSITORY_URI IMAGE_SIGNING_PUBLIC_KEY; do
            [ -n "${!name}" ] || { echo "::error::the spark-test environment variable for $name is not set"; exit 1; }
          done
          version="$(cat src/spark/_version.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "::error::$version is not a release candidate"
            exit 1
          fi
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::tag $GITHUB_REF_NAME does not name version $version"; exit 1; }
          {
            echo "version=$version"
            echo "execution_role_arn=arn:aws:iam::${account}:role/${SERVICE_ROLE_NAME}"
            # The test account's registry and the central one: the deploy reads both.
            echo "registries=${account},${central_host%%.*}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: spark-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Log in to ECR (the test repository and the central one)
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
        with:
          registries: ${{ steps.version.outputs.registries }}
          mask-password: true

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # crane copies the manifest and blobs as they are, so the digest in ECR equals the one in
      # ghcr.io (docker buildx imagetools create writes a new manifest, so it does not). The
      # same pinned and checksummed crane makes the central copy.
      - uses: ./.github/actions/install-crane

      - uses: ./.github/actions/install-cosign

      - name: Copy the image to ECR (no rebuild)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/copy-image.sh "$VERSION"

      # deploy-test.sh verifies the signature of the digest it deploys before it changes
      # anything (scripts/verify-image.sh).
      - name: Deploy
        env:
          EXECUTION_ROLE_ARN: ${{ steps.version.outputs.execution_role_arn }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_DIGEST: ${{ needs.publish-central.outputs.digest }}
        run: bash scripts/deploy-test.sh "$VERSION"
