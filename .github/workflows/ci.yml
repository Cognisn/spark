name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (with coverage)
        if: runner.os != 'Windows'
        run: pytest --cov=spark --cov-report=xml -v

      - name: Run tests (Windows — no coverage)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: pytest -v -p no:faulthandler

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  uv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel

      - name: Install Spark as a uv tool
        run: uv tool install ./dist/cognisn_spark-*.whl

      - name: Launch headless and poll until it serves
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          SPARK__INTERFACE__PORT=8765 SPARK__INTERFACE__OPEN_BROWSER=false \
            spark > spark.log 2>&1 &
          SPARK_PID=$!
          up=0
          for i in $(seq 1 45); do
            if ! kill -0 "$SPARK_PID" 2>/dev/null; then
              echo "Spark process exited early"; break
            fi
            if curl -fsS -o /dev/null http://127.0.0.1:8765/login; then
              echo "Spark is serving on :8765"; up=1; break
            fi
            sleep 2
          done
          kill "$SPARK_PID" 2>/dev/null || true
          if [ "$up" -ne 1 ]; then
            echo "=== spark.log ==="; cat spark.log; exit 1
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/

      - name: Type checking (mypy)
        continue-on-error: true
        run: mypy src/spark
