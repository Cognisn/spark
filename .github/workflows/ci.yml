name: CI

on:
  push:
    branches:
      - main
      - "release/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "refactor/**"
      - "chore/**"
      - "test/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "style/**"
      - "security/**"
  pull_request:
    branches:
      - main
      - "release/**"

jobs:
  test:
    name: personal mode (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the CPU-only torch wheel (Linux; no CUDA packages)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on SQLite (with coverage)
        if: runner.os != 'Windows'
        run: pytest -m "not postgres" --cov=spark --cov-report=xml -v

      - name: Run tests on SQLite (Windows, no coverage)
        if: runner.os == 'Windows'
        run: pytest -m "not postgres" -v -p no:faulthandler

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: coverage.xml

  server:
    name: server mode (PostgreSQL ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spark
          POSTGRES_PASSWORD: spark-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the CPU-only torch wheel (Linux; no CUDA packages)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests on PostgreSQL
        env:
          SPARK_TEST_POSTGRES: required
          SPARK_TEST_POSTGRES_URL: postgresql://spark:spark-ci-only@localhost:5432/postgres
        run: pytest -m postgres -v

      - name: spark migrate against PostgreSQL, twice
        env:
          SPARK__MODE: server
          SPARK__DATABASE__URL: postgresql://spark:spark-ci-only@localhost:5432/postgres
        run: |
          spark migrate
          spark migrate

  uv-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel

      - name: Install Spark as a uv tool
        run: uv tool install ./dist/cognisn_spark-*.whl

      - name: Migrate the personal database
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          spark migrate

      - name: Launch headless and poll until it serves
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          SPARK__INTERFACE__PORT=8765 SPARK__INTERFACE__OPEN_BROWSER=false \
            spark > spark.log 2>&1 &
          SPARK_PID=$!
          up=0
          for i in $(seq 1 45); do
            if ! kill -0 "$SPARK_PID" 2>/dev/null; then
              echo "Spark process exited early"; break
            fi
            if curl -fsS -o /dev/null http://127.0.0.1:8765/login; then
              echo "Spark is serving on :8765"; up=1; break
            fi
            sleep 2
          done
          kill "$SPARK_PID" 2>/dev/null || true
          if [ "$up" -ne 1 ]; then
            echo "=== spark.log ==="; cat spark.log; exit 1
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the CPU-only torch wheel (Linux; no CUDA packages)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (black)
        run: black --check src/ tests/ scripts/

      - name: Check imports (isort)
        run: isort --check-only src/ tests/ scripts/

      - name: Strict type checking of the new and rewritten packages (blocking)
        run: mypy --strict src/spark/db src/spark/database src/spark/migrations src/spark/mode.py scripts/licence_audit.py

      - name: Type checking of the older modules (advisory)
        continue-on-error: true
        run: mypy src/spark

  licences:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the CPU-only torch wheel (Linux; no CUDA packages)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install the runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install packaging

      - name: Licence audit (no strong copyleft; weak copyleft only as named exceptions)
        run: python scripts/licence_audit.py
